[dati]
; zip pubblico UCI "Condition Monitoring of Hydraulic Systems"
url = https://archive.ics.uci.edu/static/public/447/condition+monitoring+of+hydraulic+systems.zip
cartella = data

[db]
; database sqlite: fa da coda dei lavori e da archivio dei risultati
file = jobs.db

[api]
host = 127.0.0.1
porta = 8000

[worker]
; quanti processi lavorano in parallelo
num_worker = 1
; secondi di ritardo ARTIFICIALE dopo ogni analisi (solo per le demo, non e' tempo di calcolo)
ritardo = 0
; secondi dopo cui un lavoro "in_corso" senza risposta si considera orfano e torna in coda
lease = 30
file_log = worker.log
